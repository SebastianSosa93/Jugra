<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Normalize.css makes browsers render all elements more consistently and in line with modern standards. 
     It precisely targets only the styles that need normalizing. -->
    <link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.1/normalize.css">
    <link rel="stylesheet" type="text/css" href="/css/login.css">
    <link rel="stylesheet" type="text/css" href="/css/estilo.css">
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
   
    <title>Login</title>
</head>
<body>
    <button name="btn-cancelar" id="btn-cancelar"> ← Volver </button>
    <header class="bloque-titulo">
        <h1 name="titulo" id="titulo">Ingreso</h1>
    </header>

    <form class="formulario__login" id="formulario__login" action="/login" method="post">
        <!-- Grupo Email -->
        <div class="formulario__login-grupo" id="grupo__login-email">
            <label for="login-campo-email" class="formulario__login-label">E-mail</label>
            <div class="formulario__login-grupo-input" >
                <input type="email" name="login-campo-email" id="login-campo-email" class="formulario__login-input">
            </div>
            
        </div><!-- Grupo password -->
        <div class="formulario__login-grupo" id="grupo__login-contrasena">
            <label for="login-campo-contrasena" class="formulario__login-label">Contraseña</label>
            <div class="formulario__login-grupo-input">
                <input type="password" name="login-campo-contrasena" id="login-campo-contrasena" class="formulario__login-input">
            </div>
        </div>
        <div class="formulario__login-mensaje" id="formulario__login-mensaje">
            <p><i class="fa-solid fa-triangle-exclamation"></i> <b>Error:</b> El usuario o contraseña es inválido o no existe</p>
        </div>
    <input type="submit" value="Ingresar" name="btn-ingresar" id="btn-ingresar" class="btn-ingresar">            
   
    </form>

    <script type="module" src="/script/login.js"></script>
  <script src="/script/script.js"></script>
  <script src="https://kit.fontawesome.com/9eb32dd35e.js" crossorigin="anonymous"></script>  
</body>
</html>
